<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* 画面の中央に配置 */
    }
    
    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    
    /* ロゴマークエリア */
    .logo-area {
      margin-bottom: 25px;
    }
    .logo-area img {
      max-width: 180px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    
    h1 {
      font-size: 26px;
      font-weight: bold;
      margin: 0 0 15px 0;
      color: #111;
    }
    
    p {
      font-size: 15px;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:disabled { cursor: not-allowed; }
    .btn-main { background-color: #007bff; color: white; }
    .btn-main:active { background-color: #0056b3; }
    .btn-success { background-color: #28a745; color: white; }
    .btn-success:active { background-color: #1e7e34; }
    .btn-danger { background-color: #dc3545; color: white; }
    .btn-danger:active { background-color: #bd2130; }
    
    .step-panel { display: none; }
    .step-panel.active { display: block; }
    
    #reader {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      background-color: #eee;
    }
    
    .company-display { font-size: 20px; color: #555; margin-top: 20px; font-weight: bold; }
    .name-display { font-size: 32px; font-weight: bold; margin: 10px 0 25px 0; color: #0056b3; }
    .table-display { font-size: 52px; font-weight: bold; margin: 20px 0; color: #d9534f; }
    .loading { font-size: 18px; color: #666; font-style: italic; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div class="container">
  
  <!-- ロゴマークエリア（画像がない場合は非表示になります） -->
  <div class="logo-area">
    <img src="logo.png" alt="G-CONNECT" onerror="this.style.display='none'">
  </div>

  <!-- ステップ1: 初期画面 -->
  <div id="step-start" class="step-panel active">
    <h1>G-CONNECT セルフ受付</h1>
    <p>下のボタンを押して、<br>QRコードをかざしてください。</p>
    <button class="btn-main" onclick="startScan()">受付を開始する</button>
  </div>

  <!-- ステップ2: カメラ読み取り画面 -->
  <div id="step-scan" class="step-panel">
    <h1>QRコードを読み取っています</h1>
    <div id="reader"></div>
    <button class="btn-danger" onclick="stopScanAndReset()">キャンセル</button>
  </div>

  <!-- ステップ3: お名前・会社名確認画面 -->
  <div id="step-confirm" class="step-panel">
    <h1>情報の確認</h1>
    <p>ご本人様でお間違いないですか？</p>
    <div id="company-area" class="company-display"></div>
    <div id="name-area" class="name-display"></div>
    <button class="btn-success" onclick="confirmIdentity()">はい（受付確定）</button>
    <button class="btn-danger" onclick="stopScanAndReset()">やり直す</button>
  </div>

  <!-- ステップ4: テーブル案内画面 -->
  <div id="step-result" class="step-panel">
    <h1>受付が完了しました！</h1>
    <p>あなたのテーブルは</p>
    <div id="table-area" class="table-display"></div>
    <p>です。その場でスタッフへお会計をお願いします。</p>
    <button class="btn-main" onclick="resetSystem()">次の人へ</button>
  </div>
  
  <div id="loading" class="loading" style="display:none; margin-top:20px;">通信中...</div>

</div>

<script>
  // お送りいただいたGASウェブアプリURLを設定
  var GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzywpREq_W8Z9wSZVa2mNJV98Vepd8uK9-oDS4Z6NaxSKcotmk50BBbrtyJd6eKPE9WhA/exec";

  let html5QrcodeScanner = null;
  let currentQrData = "";
  let currentCompany = "";
  let currentMemberName = "";
  let isProcessing = false;

  function changeStep(stepId) {
    document.querySelectorAll('.step-panel').forEach(panel => panel.classList.remove('active'));
    document.getElementById(stepId).classList.add('active');
  }

  function startScan() {
    isProcessing = false;
    changeStep('step-scan');
    
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(function(stream) {
        stream.getTracks().forEach(track => track.stop());
        
        html5QrcodeScanner = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        
        html5QrcodeScanner.start(
          { facingMode: "user" }, 
          config,
          onScanSuccess
        ).catch(err => {
          html5QrcodeScanner.start({ facingMode: { exact: "user" } }, config, onScanSuccess)
            .catch(e => {
              alert("カメラの起動に失敗しました: " + e);
              resetSystem();
            });
        });
      })
      .catch(function(err) {
        alert("ブラウザのカメラアクセスが許可されていません。\nエラー詳細: " + err.name);
        resetSystem();
      });
  }

  function onScanSuccess(decodedText, decodedResult) {
    if (isProcessing) return;
    isProcessing = true; 

    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => {
        processQr(decodedText);
      }).catch(err => {
        processQr(decodedText);
      });
    } else {
      processQr(decodedText);
    }
  }

  function processQr(decodedText) {
    currentQrData = decodedText;
    document.getElementById('loading').style.display = 'block';

    fetch(GAS_WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        method: "findMember",
        qrData: currentQrData
      })
    })
    .then(response => response.json())
    .then(data => onFindMemberSuccess(data))
    .catch(error => onApiError(error));
  }

  function onFindMemberSuccess(result) {
    document.getElementById('loading').style.display = 'none';
    isProcessing = false; // 次のボタン操作のため一旦解除
    
    if (result.success) {
      currentCompany = result.company;
      currentMemberName = result.name;
      
      document.getElementById('company-area').innerText = currentCompany;
      document.getElementById('name-area').innerText = currentMemberName + " 様";
      changeStep('step-confirm');
    } else {
      alert(result.message);
      resetSystem();
    }
  }

  function confirmIdentity() {
    if (isProcessing) return;
    isProcessing = true;

    const confirmBtn = document.querySelector('#step-confirm .btn-success');
    if (confirmBtn) {
      confirmBtn.disabled = true;
      confirmBtn.style.opacity = '0.5';
    }

    document.getElementById('loading').style.display = 'block';
    
    fetch(GAS_WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        method: "confirmRegistration",
        qrData: currentQrData,
        company: currentCompany,
        name: currentMemberName
      })
    })
    .then(response => response.json())
    .then(data => onConfirmSuccess(data))
    .catch(error => onApiError(error));
  }

  function onConfirmSuccess(result) {
    document.getElementById('loading').style.display = 'none';
    if (result.success) {
      document.getElementById('table-area').innerText = result.table + " テーブル";
      changeStep('step-result');
      
      setTimeout(() => {
        if(document.getElementById('step-result').classList.contains('active')){
          resetSystem();
        }
      }, 7000);
    } else {
      alert("受付処理エラー: " + result.message);
      resetSystem();
    }
  }

  function onApiError(error) {
    document.getElementById('loading').style.display = 'none';
    alert("通信エラーが発生しました: " + (error.message || error));
    resetSystem();
  }

  function stopScanAndReset() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => { resetSystem(); }).catch(() => { resetSystem(); });
    } else {
      resetSystem();
    }
  }

  function resetSystem() {
    isProcessing = false;
    currentQrData = "";
    currentCompany = "";
    currentMemberName = "";
    document.getElementById('loading').style.display = 'none';

    const confirmBtn = document.querySelector('#step-confirm .btn-success');
    if (confirmBtn) {
      confirmBtn.disabled = false;
      confirmBtn.style.opacity = '1';
    }

    changeStep('step-start');
  }
</script>

</body>
</html>
